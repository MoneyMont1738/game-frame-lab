# Experiment 1: scalability matrix.
# 4 presets x 3 resolutions = 12 configs, each captured 3 times (36 runs).
experiment: lyra_scalability
description: >
  Lyra Starter Game (UE 5.4+, packaged Development build, Lumen on) across the four
  sg.* scalability presets at 1080p, 1440p, and 4K. Native rendering, no DLSS,
  no background inference load.

scene:
  name: lyra
  launcher: unreal
  # Edit to match the packaged build on the benchmark PC.
  executable: "C:/Benchmarks/LyraBuild/Windows/LyraGame.exe"
  process_name: LyraGame.exe
  map: /ShooterMaps/Maps/L_Expanse
  extra_args: []

capture:
  runs: 3
  duration_s: 60
  warmup_s: 10
  cooldown_s: 15

tag: baseline

matrix:
  preset: [low, medium, high, epic]
  resolution: [1920x1080, 2560x1440, 3840x2160]
  dlss_mode: [native]
  frame_generation: [false]
  inference_streams: [0]
